# Copy to config.toml and adapt. Every value can also be set by an environment variable
# (AERORACLE_DATA_DIR, AERORACLE_TEMP_DIR, AERORACLE_INPUT_DIR, AERORACLE_PUBLISH_DIR, AERORACLE_PUBLISH_URL,
# AERORACLE_SOURCE_URL, AERORACLE_WHATIF_PCT, AERORACLE_WIND_SHEAR_EXPONENT, AERORACLE_MAX_FORECAST_LOCATIONS,
# AERORACLE_CORNERING, AERORACLE_MAX_PEDALLING_SPEED_KMH).

# Folder that contains GeoData/ (DEM/, OSM/, Gravimetry/)
data_dir = "/data"

# Scratch folder for downloads: DEM tiles and the OSM extracts of tools/osm (up to a few GB at a time).
# Put it on disk if /tmp is a small RAM disk (tmpfs), as on recent Ubuntu (default: <system temp>/aeroracle)
# temp_dir = "/data/tmp"

# Folder in which bare input file names (main.py -i route.tcx) are looked up (default: <system temp>/tcx)
# input_dir = "/tmp/tcx"

# Optional publishing of main.py's outputs (TCX, GPX, FIT, wind chart) to a web server:
# the files are moved to publish_dir and linked below publish_url. Leave both unset to keep the files in place.
# publish_dir = "/var/www/html/tcx"
# publish_url = "https://example.org/tcx"

# Source code repository of the running version, linked in the web app's footer. The AGPL requires offering
# the source code to the users of a web service; set this to your repository if you run a modified version.
# source_url = "https://github.com/SARcycle/AerOracle"

# Change of each parameter (weight, power, CdA, Crr) in the what-if table, in % (default 1)
# whatif_pct = 1

# Exponent converting the forecast wind (10 m above ground) to rider height (1.2 m): v = v10 * (1.2 / 10)^exponent.
# An effective value: so close to the ground, the terrain's roughness and the shelter of trees, hedges and buildings set it,
# not the stability of the air. 0.5 (35% of the 10 m wind, roughness length about 0.4 m: mixed country with trees,
# hedges and villages) was checked against about 140 rides measured with power meters. Use about 0.2 for open, flat
# country or coasts, up to 0.7 for roads mostly through villages and forest; 0 = no conversion (default 0.5)
# wind_shear_exponent = 0.5

# Weather forecast locations per ride at most (one every 10 min of ride time; on longer rides the interval grows in 5 min steps).
# Limits the load on the weather APIs, whose free quotas all users share (default 50: unchanged up to about 8 h)
# max_forecast_locations = 50

# Default rider level in corners (lateral acceleration accepted / braking): cautious (0.30 g / 0.30 g), average (0.45 / 0.40),
# confident (0.60 / 0.50) or racer (0.80 / 0.60); the tyre grip (0.9 g) limits every level (default average)
# cornering = "average"

# Speed above which riders stop pedalling (cadence limit with the largest gear, e.g. 53-11 at about 110 rpm) (default 65)
# max_pedalling_speed_kmh = 65
